#
#

name: 🚀 Build_imm_高通410系列

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' ← 选择是否开启 SSH 调试专业人员使用'
        required: false
        default: false
        type: boolean
      profile:
        description: ' ↓ 支持多款型号 手动选择要编译的机型 ↓ '
        type: choice
        options:
          - ufi003
          - ufi001c
          - ufi001b
          - ufi103s
          - jz02v10
          - qrzl903
          - w001
          - uz801
          - mf32
          - mf601
          - wf2
          - sp970v11
          - sp970v10
        default: ufi003
        required: true
      upstream:
        description: ' ↓ 选择上游源码仓库 ↓ '
        type: choice
        options:
          - lkiuyu/immortalwrt
        default: lkiuyu/immortalwrt
        required: true
      custom_hash:
        description: ' ↓ 可选：指定上游 commit hash；留空使用最新 master ↓ '
        required: false
        default: ''
        type: string
      extra_packages:
        description: ' ↓ 输入额外包名（逗号或空格分隔，留空则不添加任何额外包）↓ '
        required: false
        default: ''
        type: string

env:
  # Keep the existing workflow_dispatch inputs compatible. The payload fallback
  # also makes the declared repository_dispatch trigger usable.
  INPUT_SSH: ${{ github.event.inputs.ssh || github.event.client_payload.ssh || 'false' }}
  INPUT_PROFILE: ${{ github.event.inputs.profile || github.event.client_payload.profile || 'ufi003' }}
  INPUT_UPSTREAM: ${{ github.event.inputs.upstream || github.event.client_payload.upstream || 'lkiuyu/immortalwrt' }}
  INPUT_CUSTOM_HASH: ${{ github.event.inputs.custom_hash || github.event.client_payload.custom_hash || '' }}
  INPUT_EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages || github.event.client_payload.extra_packages || '' }}
  REPO_URL: https://github.com/${{ github.event.inputs.upstream || github.event.client_payload.upstream || 'lkiuyu/immortalwrt' }}
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ${{ format('config/{0}.config', github.event.inputs.profile || github.event.client_payload.profile || 'ufi003') }}
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  DOWNLOAD_MIRROR: https://sources.cdn.openwrt.org;https://sources.openwrt.org;https://mirror2.openwrt.org/sources
  TZ: Asia/Shanghai

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.event.inputs.profile || github.event.client_payload.profile || 'ufi003' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Leave room for feeds, downloads, toolchain and full firmware compilation.
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write
    steps:
    - name: 🚀 编译 (Build)
      uses: actions/checkout@v7.0.1

    - name: Show hardware info
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh
  
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: true
        android: false
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
        
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        sudo -E apt-get -y install aria2
        sudo -E apt-get -y install $(curl -fsSL https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt)
        aria2c --version | head -1

    - name: mkbootimg build
      run: |
        curl --fail --location --retry 5 --retry-delay 5 --connect-timeout 30 \
          --output mkbootimg_34.0.5-12build1_all.deb \
          https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
        sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb
        sudo apt-get install -f -y
        # 验证安装
        mkbootimg --help || true
        MKBOOTIMG_PATH=$(which mkbootimg)
        if [ -n "$MKBOOTIMG_PATH" ]; then
        echo "mkbootimg found at: $MKBOOTIMG_PATH"
        file "$MKBOOTIMG_PATH"
        else
        echo "❌ mkbootimg not found in PATH!"
        fi

        sudo timedatectl set-timezone "$TZ"
        sudo chmod 777 /mnt
        df -hT
        
    - name: Ensure Python build tools
      run: |
       python3 -m pip cache purge
       python3 -m pip install --upgrade --force-reinstall pip
       python3 -m pip install --upgrade --force-reinstall 'setuptools>=65' wheel
       python3 -m pip install --upgrade 'setuptools-scm>=8,<10'
       python3 -m pip install --upgrade cython packaging tomli
       python3 -m pip install Unidecode pyelftools
       python3 -m pip --version
       python3 -c "import setuptools.build_meta; print('setuptools.build_meta OK')"

    - name: Reclaim disk space before build
      run: |
        sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/*
        rm -rf "$HOME/.cache/pip" "$HOME/.cache"/go-build
        rm -f mkbootimg_34.0.5-12build1_all.deb
        df -hT



    - name: 读取锁定的上游 hash (Read locked upstream hash)
      id: lock
      run: |
        CUSTOM_HASH="$INPUT_CUSTOM_HASH"
        LOCK_FILE="upstream_lock.txt"
        if [ -n "$CUSTOM_HASH" ]; then
          echo "locked_hash=$CUSTOM_HASH" >> $GITHUB_OUTPUT
          echo "使用用户指定 hash: $CUSTOM_HASH"
        elif [ -f "$LOCK_FILE" ]; then
          # Keep upstream_lock.txt as an audit/reproducibility record, but use
          # the current branch for normal builds. Pass custom_hash explicitly
          # when an exact upstream revision is required.
          echo "locked_hash=" >> $GITHUB_OUTPUT
          echo "忽略默认锁定 hash，使用最新 ${REPO_BRANCH}；需要复现时请填写 custom_hash"
        else
          echo "locked_hash=" >> $GITHUB_OUTPUT
          echo "使用最新 ${REPO_BRANCH}"
        fi

    - name: Clone source code
      timeout-minutes: 15
      working-directory: /mnt
      run: |
        set -Eeuo pipefail
        df -hT "$PWD"
        timeout --signal=TERM --kill-after=2m 12m git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
        if [ -n "${{ steps.lock.outputs.locked_hash }}" ]; then
          cd openwrt && timeout --signal=TERM --kill-after=2m 3m git fetch --depth 1 origin "${{ steps.lock.outputs.locked_hash }}" && git checkout "${{ steps.lock.outputs.locked_hash }}"
        fi
        ln -sf /mnt/openwrt $GITHUB_WORKSPACE/openwrt


    - name:  files
      run: cp -r files openwrt/files

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        

    - name: Update feeds
      timeout-minutes: 30
      run: timeout --signal=TERM --kill-after=2m 25m bash -c 'cd openwrt && ./scripts/feeds update -a'

    - name: Remove conflicting packages from smpackage
      run: |
        # 删除 small-package 中与系统冲突的包，避免编译报错（官方推荐操作）
        rm -rf openwrt/feeds/smpackage/{base-files,dnsmasq,firewall*,fullconenat,libnftnl,nftables,ppp,opkg,ucl,upx,vsftpd*,miniupnpd-iptables,wireless-regdb}

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a -f

    - name: Prepare latest trusted Git source archives
      timeout-minutes: 60
      run: |
        set -Eeuo pipefail
        mkdir -p openwrt/dl
        # Feed Makefiles describe source archives, but several old mirror
        # copies are gone. Resolve HEAD from each canonical Git repository,
        # generate the archive locally, and update the feed hash to the bytes
        # actually placed in dl/. Integrity checking remains enabled.
        prepare_latest_archive() {
          local repo="$1" archive="$2" subdir="$3" makefile="$4" compression="$5" source_ref="${6:-HEAD}"
          test -f "$makefile"
          echo "Probing canonical source: $repo ($source_ref)"
          local commit
          local probe_attempt=0
          commit=""
          until [ "$probe_attempt" -ge 5 ] || [ -n "$commit" ]; do
            probe_attempt=$((probe_attempt + 1))
            commit=$(git ls-remote --exit-code "$repo" "$source_ref" 2>/dev/null | awk 'NR == 1 { print $1; exit }' || true)
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || commit=""
            [ -n "$commit" ] || { echo "Source probe attempt $probe_attempt/5 failed; retrying..." >&2; sleep $((probe_attempt * 5)); }
          done
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "No usable revision for $repo $source_ref" >&2; exit 1; }
          echo "Using probed $source_ref commit $commit"
          sed -i -E "s|^PKG_SOURCE_URL:=.*|PKG_SOURCE_URL:=$repo|" "$makefile"
          sed -i -E "s|^PKG_SOURCE_VERSION:=.*|PKG_SOURCE_VERSION:=$commit|" "$makefile"
          archive=${archive//\{commit\}/$commit}

          local tmp="/tmp/${subdir}-source" packed="/tmp/${subdir}-packed" git_tar="/tmp/${subdir}.tar.git"
          rm -rf "$tmp" "$packed" "$git_tar" "openwrt/dl/$archive"
          git clone --filter=blob:none --no-checkout "$repo" "$tmp"
          git -C "$tmp" checkout --force "$commit"
          git -C "$tmp" config core.abbrev 8
          local timestamp
          timestamp=$(git -C "$tmp" log -1 --no-show-signature --format='@%ct')
          git -C "$tmp" archive --format=tar HEAD --output="$git_tar"
          tar --numeric-owner --owner=0 --group=0 --ignore-failed-read \
            -C "$tmp" -f "$git_tar" -r .git .gitmodules 2>/dev/null || true
          mkdir -p "$packed/$subdir"
          tar -C "$packed/$subdir" -xf "$git_tar"
          (cd "$packed/$subdir" && git submodule update --init --recursive -- && rm -rf .git .gitmodules)
          case "$compression" in
            xz) tar --numeric-owner --owner=0 --group=0 --mode=a-s --sort=name --mtime="$timestamp" -C "$packed" -c "$subdir" | xz -zc -7e > "openwrt/dl/$archive" ;;
            zst) tar --numeric-owner --owner=0 --group=0 --mode=a-s --sort=name --mtime="$timestamp" -C "$packed" -c "$subdir" | zstd -T0 --ultra -20 -c > "openwrt/dl/$archive" ;;
            gz) tar --numeric-owner --owner=0 --group=0 --mode=a-s --sort=name --mtime="$timestamp" -C "$packed" -c "$subdir" | gzip -nc > "openwrt/dl/$archive" ;;
            *) echo "Unsupported compression: $compression" >&2; exit 1 ;;
          esac
          local hash
          hash=$(sha256sum "openwrt/dl/$archive" | awk '{print $1}')
          sed -i -E "s|^PKG_MIRROR_HASH:=.*|PKG_MIRROR_HASH:=$hash|" "$makefile"
          grep -q "^PKG_MIRROR_HASH:=$hash$" "$makefile"
          test -s "openwrt/dl/$archive"
          echo "Prepared and verified openwrt/dl/$archive ($hash)"
          rm -rf "$tmp" "$packed" "$git_tar"
        }
        prepare_latest_archive https://github.com/lkiuyu/gc.git gc-20260310.tar.xz gc-20260310 openwrt/feeds/openstick/utils/gc/Makefile xz
        prepare_latest_archive https://github.com/linux-usb-gadgets/libusbgx.git libusbgx-0.3.0.tar.xz libusbgx-0.3.0 openwrt/feeds/openstick/libs/libusbgx/Makefile xz
        prepare_latest_archive https://github.com/linux-msm/qrtr.git qrtr-1.1.tar.xz qrtr-1.1 openwrt/feeds/openstick/utils/qrtr/Makefile xz
        prepare_latest_archive https://github.com/lkiuyu/qcom-firmware.git qcom-firmware-1034.2.4.tar.xz qcom-firmware-1034.2.4 openwrt/feeds/openstick/firmware/qcom-firmware/Makefile xz
        prepare_latest_archive https://github.com/lkiuyu/android-tools.git 'android-tools-4.2.2-{commit}.tar.gz' android-tools-4.2.2 openwrt/feeds/openstick/utils/android-tools/Makefile gz
        prepare_latest_archive https://github.com/linux-msm/rmtfs.git rmtfs-1.1.1.tar.xz rmtfs-1.1.1 openwrt/feeds/openstick/utils/rmtfs/Makefile xz
        # The feed Makefile is an OpenWrt 1.24.0 package recipe. Keep its
        # source contract tied to the immutable upstream 1.24.0 tag instead of
        # silently compiling an unrelated moving master HEAD.
        prepare_latest_archive https://github.com/linux-mobile-broadband/ModemManager.git modemmanager-1.24.0.tar.zst modemmanager-1.24.0 openwrt/feeds/openstick/net/modemmanager/Makefile zst 'refs/tags/1.24.0^{}'

    - name: Load custom configuration
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Install extra packages
      if: ${{ env.INPUT_EXTRA_PACKAGES != '' }}
      run: |
        set -Eeuo pipefail
        cd openwrt
        echo "=========================================="
        echo "User requested extra packages:"
        printf '%s\n' "$INPUT_EXTRA_PACKAGES"
        echo "=========================================="

        # Parse the existing comma/space-separated input without interpolating it
        # into shell source. __ip__ and __hostname__ remain backward compatible.
        CUSTOM_IP=""
        CUSTOM_HOSTNAME=""
        PACKAGES=()
        while IFS= read -r token; do
          [ -z "$token" ] && continue
          case "$token" in
            __ip__*)
              CUSTOM_IP="${token#__ip__}"
              [[ "$CUSTOM_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo "Invalid __ip__ value" >&2; exit 1; }
              ;;
            __hostname__*)
              CUSTOM_HOSTNAME="${token#__hostname__}"
              [[ "$CUSTOM_HOSTNAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$ ]] || { echo "Invalid __hostname__ value" >&2; exit 1; }
              ;;
            *)
              [[ "$token" =~ ^[A-Za-z0-9][A-Za-z0-9_.+-]*$ ]] || { echo "Invalid package name: $token" >&2; exit 1; }
              PACKAGES+=("$token")
              ;;
          esac
        done < <(printf '%s\n' "$INPUT_EXTRA_PACKAGES" | tr ', ' '\n')

        if [ -n "$CUSTOM_IP" ]; then
          echo "🌐 设置管理 IP: $CUSTOM_IP"
          sed -i "s/192\.168\.1\.1/$CUSTOM_IP/g" package/base-files/files/bin/config_generate
        fi

        if [ -n "$CUSTOM_HOSTNAME" ]; then
          echo "🏷️ 设置主机名: $CUSTOM_HOSTNAME"
          sed -i "s/set system\.@system\[0\]\.hostname='ImmortalWrt'/set system.@system[0].hostname='$CUSTOM_HOSTNAME'/" package/base-files/files/bin/config_generate || true
          sed -i "s/option hostname 'ImmortalWrt'/option hostname '$CUSTOM_HOSTNAME'/" package/base-files/files/etc/config/system 2>/dev/null || true
        fi

        if printf '%s\n' "${PACKAGES[@]}" | grep -qx "luci-app-turboacc"; then
          echo "⚡ 检测到 luci-app-turboacc，执行 turboacc 安装脚本..."
          curl --fail --location --retry 3 --connect-timeout 20 \
            https://raw.githubusercontent.com/mufeng05/turboacc/main/add_turboacc.sh \
            --output add_turboacc.sh
          bash add_turboacc.sh || echo "⚠️ turboacc 脚本执行失败，跳过"
        fi

        for pkg in "${PACKAGES[@]}"; do
          CFG="CONFIG_PACKAGE_${pkg}"
          if grep -q "^# ${CFG} is not set" .config; then
            sed -i "s/^# ${CFG} is not set$/${CFG}=y/" .config
            echo "✅ Enabled (replaced): ${CFG}=y"
          elif grep -q "^${CFG}=" .config; then
            sed -i "s/^${CFG}=.*$/${CFG}=y/" .config
            echo "✅ Enabled (updated): ${CFG}=y"
          else
            echo "${CFG}=y" >> .config
            echo "✅ Enabled (appended): ${CFG}=y"
          fi
        done
        
        
    - name: SSH 调试有效时间6h! 连接后输入q 输入exit即可退出，自动继续后续编译流程
      uses: mxschmitt/action-tmate@c4658e2cd8a2789352e1400f38a57e78587a66f3
      if: ${{ env.INPUT_SSH == 'true' || contains(github.event.action, 'ssh') }}
      
      
    - name: Config defconfig
      id: config
      run: |
       cd openwrt
       make defconfig
       
    - name: Prepare opkg source fallback
      timeout-minutes: 15
      run: |
        set -Eeuo pipefail
        cd openwrt
        OPKG_VERSION=80503d94e356476250adaf1f669ee955ec26de76
        OPKG_NAME=opkg-2025.11.05~80503d94
        OPKG_ARCHIVE="dl/${OPKG_NAME}.tar.zst"
        if [ ! -f "$OPKG_ARCHIVE" ]; then
          rm -rf "/tmp/$OPKG_NAME" "/tmp/$OPKG_NAME-packed" "/tmp/$OPKG_NAME.tar.git"
          git clone --filter=blob:none --no-checkout https://git.openwrt.org/project/opkg-lede.git "/tmp/$OPKG_NAME"
          git -C "/tmp/$OPKG_NAME" checkout --force "$OPKG_VERSION"
          TAR_TIMESTAMP=$(git -C "/tmp/$OPKG_NAME" log -1 --no-show-signature --format='@%ct')
          git -C "/tmp/$OPKG_NAME" config core.abbrev 8
          git -C "/tmp/$OPKG_NAME" archive --format=tar HEAD --output="/tmp/$OPKG_NAME.tar.git"
          tar --numeric-owner --owner=0 --group=0 --ignore-failed-read \
            -C "/tmp/$OPKG_NAME" -f "/tmp/$OPKG_NAME.tar.git" -r .git .gitmodules 2>/dev/null || true
          mkdir -p "/tmp/$OPKG_NAME-packed/$OPKG_NAME"
          tar -C "/tmp/$OPKG_NAME-packed/$OPKG_NAME" -xf "/tmp/$OPKG_NAME.tar.git"
          (cd "/tmp/$OPKG_NAME-packed/$OPKG_NAME" && git submodule update --init --recursive -- && rm -rf .git .gitmodules)
          tar --numeric-owner --owner=0 --group=0 --mode=a-s --sort=name \
            --mtime="$TAR_TIMESTAMP" -C "/tmp/$OPKG_NAME-packed" -c "$OPKG_NAME" | \
            zstd -T0 --ultra -20 -c > "$OPKG_ARCHIVE"
          echo "41fb2c79ce6014e28f7dd0cd8c65efe803986278f2587d1d4681883d8847d87c  $OPKG_ARCHIVE" | sha256sum -c -
          rm -rf "/tmp/$OPKG_NAME" "/tmp/$OPKG_NAME-packed" "/tmp/$OPKG_NAME.tar.git"
        fi
        test -s "$OPKG_ARCHIVE"
        # Capture the listing before checking it: a direct tar | grep -q pipe
        # gives tar SIGPIPE when grep exits first (exit 2 under set -e,
        # observed in run 34601383285).
        OPKG_FIRST_ENTRY=$(tar --zstd -tf "$OPKG_ARCHIVE" | sed -n '1p')
        [[ "$OPKG_FIRST_ENTRY" == "${OPKG_NAME}/"* ]] || { echo "opkg 归档顶层目录异常: $OPKG_FIRST_ENTRY" >&2; exit 1; }
        echo "Prepared $OPKG_ARCHIVE"

    - name: Prefetch large tarballs with aria2c
      timeout-minutes: 30
      run: |
        set -Eeuo pipefail
        cd openwrt
        mkdir -p dl
        ARIA2C="aria2c --console-log-level=warn --summary-interval=0 -x8 -s8 -k1M --max-tries=8 --retry-wait=3 --timeout=60 --connect-timeout=20 --allow-overwrite=true --auto-file-renaming=false --continue=true --dir=dl"
        # Linux kernel tarball (~140MB) pinned to the locked upstream commit.
        KERNEL_VERSION="6.12.85"
        KERNEL_HASH="e35ac999f40a6874493d8d60f33f1150d7a89ae5841c428da82257fbcd070aed"
        $ARIA2C "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz"
        echo "${KERNEL_HASH}  dl/linux-${KERNEL_VERSION}.tar.xz" | sha256sum -c -
        echo "Kernel tarball prefetched with aria2c (multithreaded)."

    - name: Download package
      id: package
      timeout-minutes: 90
      run: |
        set -o pipefail
        cd openwrt
        # Prefer GitHub source archives over distfile mirrors when both exist.
        # A mirror that returns 200 with an HTML error page is worse than a clean 404.
        export DOWNLOAD_MIRROR="https://sources.cdn.openwrt.org;https://sources.openwrt.org;https://mirror2.openwrt.org/sources"
        # download.pl can invoke a custom downloader. Keep curl for small
        # objects, but let scripts/download-source.sh probe Content-Length and
        # use aria2c for objects >=10 MiB. The payload remains on stdout so
        # download.pl hashes exactly what it receives.
        chmod +x "$GITHUB_WORKSPACE/scripts/download-source.sh"
        export DOWNLOAD_TOOL_CUSTOM="$GITHUB_WORKSPACE/scripts/download-source.sh"
        run_download() {
          timeout --signal=TERM --kill-after=5m 80m make download -j"$(nproc)" V=s 2>&1 | tee -a "$GITHUB_WORKSPACE/download.log"
          return "${PIPESTATUS[0]}"
        }
        download_status=0
        run_download || download_status=$?
        if [ "$download_status" -ne 0 ] || grep -Eiq 'No more mirrors to try - giving up|ERROR: package/.*(failed to build|download)' "$GITHUB_WORKSPACE/download.log"; then
          echo "::warning::首轮下载存在失败，用 make download -j1 串行重试一轮..."
          : > "$GITHUB_WORKSPACE/download-retry.log"
          timeout --signal=TERM --kill-after=5m 60m make download -j1 V=s 2>&1 | tee -a "$GITHUB_WORKSPACE/download-retry.log" || true
          cat "$GITHUB_WORKSPACE/download-retry.log" >> "$GITHUB_WORKSPACE/download.log"
          # After the serial retry pass a terminal error is fatal.
          if grep -Eiq 'No more mirrors to try - giving up|ERROR: package/.*(failed to build|download)' "$GITHUB_WORKSPACE/download.log"; then
            echo "::error::软件包下载重试后仍失败，以下是失败项："
            grep -Ein 'No more mirrors to try - giving up|ERROR: package/.*(failed to build|download)' "$GITHUB_WORKSPACE/download.log" || true
            exit 1
          fi
        fi
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Remove download diagnostics after success
      if: steps.package.conclusion == 'success'
      run: rm -f "$GITHUB_WORKSPACE/download.log"

    - name: Upload download diagnostics
      if: failure() && steps.package.conclusion == 'failure'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: download-diagnostics
        path: download.log
        if-no-files-found: ignore

    - name: 查看 openwrt 目录
      run: ls -la openwrt/
      
           ls -l .config
      
           ls -la openwrt/.config

 
    - name: 自动上传最新源码生成.config编译配置
      uses: actions/upload-artifact@v7.0.1
      with:
       name: build-config
       path: |
         ${{ github.workspace }}/openwrt/.config
         ${{ github.workspace }}/openwrt/feeds.conf.default
       include-hidden-files: true


    - name: Compile the firmware
      id: compile
      timeout-minutes: 300
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        timeout --signal=TERM --kill-after=5m 290m make -j"$(nproc)"
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Get kernel version
      run: |
        KERNEL_VER=$(cat /mnt/openwrt/build_dir/target-*/linux-*/linux-*/.kernelversion 2>/dev/null | head -1 || echo "未知")
        echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV


    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Fix Git buffer
      run: git config --global http.postBuffer 524288000

    - name: Upload bin directory
      uses: actions/upload-artifact@v7.0.1
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        PROFILE="$INPUT_PROFILE"

        # 创建刷机包目录并打包 zip
        mkdir -p flash_package
        BOOT_IMG=$(ls *boot.img.gz *boot.img 2>/dev/null | head -1)
        SYSTEM_IMG=$(ls *system.img.gz *system.img 2>/dev/null | head -1)
        if [ -z "$BOOT_IMG" ] || [ -z "$SYSTEM_IMG" ]; then
          echo "::error::固件文件未找到，编译可能失败！当前目录文件："
          ls -la
          exit 1
        fi
        cp "$BOOT_IMG" flash_package/boot.img.gz
        cp "$SYSTEM_IMG" flash_package/system.img.gz
        # 解压供刷机脚本使用
        gzip -dk flash_package/boot.img.gz
        gzip -dk flash_package/system.img.gz
        rm flash_package/boot.img.gz flash_package/system.img.gz
        cp -r $GITHUB_WORKSPACE/刷机脚本/. flash_package/
        # 确保 bat 文件是 CRLF 换行（Windows 兼容）
        unix2dos flash_package/*.bat 2>/dev/null || sed -i 's/\r//' flash_package/*.bat && sed -i 's/$/\r/' flash_package/*.bat
        ZIP_NAME="OpenWrt_${PROFILE}${{ env.FILE_DATE }}_刷机包.zip"
        cd flash_package && zip -r "../$ZIP_NAME" . && cd ..

        # 整理 release 目录：zip + 单独固件 + 编译信息
        mkdir -p release_files
        mv "$ZIP_NAME" release_files/
        cp *.manifest release_files/ 2>/dev/null || true
        cp *.buildinfo release_files/ 2>/dev/null || true
        cp sha256sums release_files/ 2>/dev/null || true

        echo "FIRMWARE=$PWD/release_files" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v7.0.1
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        PROFILE="$INPUT_PROFILE"
        # 提取用户设置的 IP 和主机名
        RAW="$INPUT_EXTRA_PACKAGES"
        CUSTOM_IP=$(echo "$RAW" | grep -oP '(?<=__ip__)[^,\s]+' || true)
        CUSTOM_HOSTNAME=$(echo "$RAW" | grep -oP '(?<=__hostname__)[^,\s]+' || true)
        DISPLAY_IP=${CUSTOM_IP:-192.168.1.1}
        DISPLAY_HOSTNAME=${CUSTOM_HOSTNAME:-ImmortalWrt}
        # 过滤掉特殊前缀，只显示真正的包名
        EXTRA=$(echo "$RAW" | sed 's/,/ /g' | tr ' ' '\n' | grep -v '^__ip__' | grep -v '^__hostname__' | sed '/^$/d')

        echo "release_tag=$(date +"%Y.%m.%d-%H%M")-${PROFILE}" >> $GITHUB_OUTPUT
        touch release.txt
        {
          echo "## Immortalwrt master分支 高通410系列 · ${PROFILE}"
          echo ""
          echo "| 项目 | 信息 |"
          echo "|------|------|"
          echo "| 编译者 | ${{ github.actor }} |"
          echo "| 机型 | ${PROFILE} |"
          echo "| 内核版本 | ${{ env.KERNEL_VER }} |"
          echo "| 管理地址 | ${DISPLAY_IP} |"
          echo "| 主机名 | ${DISPLAY_HOSTNAME} |"
          echo "| 默认用户 | root |"
          echo "| 默认密码 | 空 |"
          echo ""
          if [ -n "$EXTRA" ]; then
            echo "### 额外添加的包"
            echo "$EXTRA" | sed 's/^/- /'
          else
            echo "### 额外添加的包"
            echo "无"
          fi
        } >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT



    - name: Generate file list
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      run: |
        find ${{ env.FIRMWARE }} -type f > file_list.txt
        echo "Collected files:"
        cat file_list.txt
        test -s file_list.txt || { echo "::error::No firmware files found"; exit 1; }



    - name: Upload firmware to release
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      uses: ncipollo/release-action@v1.21.0
      timeout-minutes: 15
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        bodyFile: release.txt
        artifacts: ${{ env.FIRMWARE }}/**/*
        artifactErrorsFailBuild: true
        allowUpdates: true
        draft: false
        prerelease: false

    - name: Delete old workflow runs via GitHub API
      if: always()
      timeout-minutes: 5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RETAIN_DAYS: 7
        KEEP_MINIMUM_RUNS: 5
      run: |
        set -Eeuo pipefail
        RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          --connect-timeout 10 --max-time 30 \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100")
        CUTOFF=$(date -d "-${RETAIN_DAYS} days" +%s)
        DEL_IDS=$(echo "$RUNS" | jq -r --arg cutoff "$CUTOFF" --argjson keep "$KEEP_MINIMUM_RUNS" '
          [.workflow_runs[]
            | select((now - (.created_at | fromdateiso8601)) > ($cutoff | tonumber))
            | {id, created_at}
          ]
          | sort_by(.created_at)
          | .[:-$keep]
          | .[].id
        ')
        if [[ -z "$DEL_IDS" ]]; then
          echo "No old runs to delete."
        else
          echo "$DEL_IDS" | while read run_id; do
            echo "Deleting run $run_id"
            curl --fail --silent --show-error -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              --connect-timeout 10 --max-time 30 \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
          done
        fi